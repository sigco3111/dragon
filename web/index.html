<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일: 뷰포트 메타 부재 시 980px 폴백으로 전체가 축소 표시됨.
         640px 설계 폭으로 레이아웃하고 기기 폭에 맞춰 축소(표시 전용, 규칙 무영향). -->
    <meta name="viewport" id="wylviewport" content="width=640, user-scalable=yes, maximum-scale=3" />
    <script>
      // 모바일 방향 대응 뷰포트 (표시 전용, 규칙 무영향).
      // 세로: 설계 폭 640 유지. 가로: 논리 높이 720이 되도록 폭을 계산해
      // 전략 UI(상단바+맵+우측 패널) 전체가 화면에 들어오게 한다.
      // 데스크톱 브라우저는 viewport 메타를 적용하지 않으므로 영향 없음.
      (function () {
        var PORTRAIT_W = 640;
        var LANDSCAPE_H = 720;
        function applyViewport() {
          var meta = document.querySelector('meta[name="viewport"]');
          if (!meta) return;
          var w = window.innerWidth || 0;
          var h = window.innerHeight || 0;
          if (!w || !h) return;
          var width = PORTRAIT_W;
          if (w > h) width = Math.max(PORTRAIT_W, Math.round((w / h) * LANDSCAPE_H));
          var content = "width=" + width + ", user-scalable=yes, maximum-scale=3";
          if (meta.getAttribute("content") !== content) meta.setAttribute("content", content);
        }
        applyViewport();
        window.addEventListener("resize", applyViewport);
        window.addEventListener("orientationchange", function () {
          setTimeout(applyViewport, 100);
        });
      })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* GameBar canvas popups and tactical DOM popups share this 16px policy. */
        --popup-font-size: 16px;
      }
      /* 表格数字字体 (原版风格替代): Oswald */
      @font-face {
        font-family: "Oswald";
        src: url("font/Oswald-Light.woff2") format("woff2");
        font-weight: 300;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
        overflow: hidden;
        font-family: "Noto Serif KR", "Noto Serif TC", "PMingLiU", serif;
      }
      select,
      button {
        font-family: "Noto Serif KR", "Noto Serif TC", "PMingLiU", sans-serif;
      }
      #cv {
        display: none;
        width: 100vw;
        height: 100vh;
        /* 战略层不用系统箭头：MapView 每帧绘制原版风格圆角方框光标。 */
        cursor: none;
      }
      body.game-active #cv {
        display: block;
      }
      /* Opening background and controls are layered by intro/styles.css. */
      body.game-active #titlebg {
        display: none;
      }
      .panel {
        position: fixed;
        background: rgba(20, 15, 10, 0.88);
        border: 1px solid #6b5335;
        border-radius: 6px;
        color: #e8d9b0;
        user-select: none;
      }
      #panel {
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        font-size: 14px;
      }
      .tab {
        display: inline-block;
        margin: 2px;
        padding: 3px 10px;
        border: 1px solid #6b5335;
        border-radius: 4px;
        cursor: pointer;
      }
      .tab.on {
        background: #8a6d3b;
        color: #fff;
      }
      #tip {
        position: fixed;
        display: none;
        background: rgba(20, 15, 10, 0.95);
        color: #f0e6c8;
        border: 1px solid #6b5335;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 13px;
        pointer-events: none;
        line-height: 1.7;
        z-index: 9;
      }
      #legend {
        right: 12px;
        top: 12px;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.9;
        max-height: 80vh;
        overflow-y: auto;
      }
      .frow {
        cursor: pointer;
      }
      .frow:hover {
        background: #3a2e1c;
        border-radius: 3px;
      }
      .dim {
        color: #8a7a55;
      }
      #card {
        left: 12px;
        bottom: 12px;
        padding: 10px;
        display: none;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        line-height: 1.8;
      }
      #settlelog {
        color: #8fb86b;
        margin-left: 10px;
        font-size: 12px;
      }
      #card img {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
        border: 1px solid #6b5335;
        border-radius: 4px;
      }
      #cmdpanel {
        left: 50%;
        transform: translateX(-50%);
        bottom: 12px;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.8;
        display: none;
      }
      #savedlg {
        left: 50%;
        transform: translateX(-50%);
        bottom: 60px;
        padding: 12px 16px;
        font-size: 14px;
        z-index: 15;
      }
      #savedlg .slot {
        display: block;
        width: 100%;
        text-align: left;
        margin: 3px 0;
        cursor: pointer;
      }
      #flashlog {
        position: fixed;
        right: 12px;
        bottom: 12px;
        font-size: 13px;
        color: #e8d9b0;
        pointer-events: none;
        text-align: right;
        z-index: 9;
      }
      #flashlog div {
        background: rgba(20, 15, 10, 0.85);
        border: 1px solid #6b5335;
        border-radius: 4px;
        padding: 2px 8px;
        margin-top: 4px;
      }
      #bctl {
        --battle-ui-scale: 1;
        position: fixed;
        inset: 0 0 0 auto;
        width: calc(160px * var(--battle-ui-scale));
        overflow: visible;
        color: #e8d9b0;
        font-family: "Noto Serif KR", "Noto Serif TC", "PMingLiU", serif;
        font-size: calc(11px * var(--battle-ui-scale));
        line-height: 1.25;
        z-index: 31;
        display: none;
        user-select: none;
        pointer-events: none;
      }
      .battle-panel-inner {
        position: static;
        width: 100%;
        height: 100%;
      }
      .battle-floating-window {
        position: absolute;
        width: calc(192px * var(--battle-ui-scale));
        box-sizing: border-box;
        pointer-events: auto;
      }
      .battle-window-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        pointer-events: none;
        z-index: 0;
      }
      .battle-floating-window > :not(.battle-window-frame) {
        z-index: 1;
      }
      .battle-operation-header {
        position: fixed;
        top: calc(16px * var(--battle-ui-scale));
        left: calc(16px * var(--battle-ui-scale));
        right: auto;
        height: calc(80px * var(--battle-ui-scale));
        box-sizing: border-box;
        padding: calc(16px * var(--battle-ui-scale));
        color: #ffd700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: bold;
        font-size: calc(16px * var(--battle-ui-scale));
        letter-spacing: 1px;
        line-height: 1.3;
      }
      #btitle, #bbelligerents {
        width: 100%;
        min-height: calc(16px * var(--battle-ui-scale));
        white-space: nowrap;
      }
      .battle-enemy-window {
        top: calc(16px * var(--battle-ui-scale));
        right: calc(16px * var(--battle-ui-scale));
        height: calc(112px * var(--battle-ui-scale));
      }
      .battle-player-window {
        right: calc(16px * var(--battle-ui-scale));
        bottom: calc(16px * var(--battle-ui-scale));
        height: calc(288px * var(--battle-ui-scale));
      }
      .battle-banner-row {
        position: absolute;
        top: calc(16px * var(--battle-ui-scale));
        left: calc(16px * var(--battle-ui-scale));
        width: calc(160px * var(--battle-ui-scale));
        height: calc(20px * var(--battle-ui-scale));
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .battle-banner-enemy { color: #8fb8ff; }
      .battle-banner-player { color: #ff9b7e; }
      .battle-banner-name {
        width: 100%;
        margin: 0;
        font-size: calc(16px * var(--battle-ui-scale));
        font-weight: bold;
        color: #fff;
        text-shadow: 1px 1px 0 #000;
        text-align: center;
        overflow: hidden;
        white-space: nowrap;
      }
      .battle-stats-row {
        position: absolute;
        top: calc(40px * var(--battle-ui-scale));
        left: calc(16px * var(--battle-ui-scale));
        width: calc(160px * var(--battle-ui-scale));
        display: flex;
        flex-direction: column;
        gap: calc(2px * var(--battle-ui-scale));
        color: #fff;
        font-size: calc(16px * var(--battle-ui-scale));
        font-weight: normal;
        line-height: calc(18px * var(--battle-ui-scale));
        white-space: nowrap;
      }
      .battle-stat-line {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .battle-stat-number {
        color: #fff;
        font-family: "Oswald", sans-serif;
        font-weight: 300;
        text-align: right;
      }
      .battle-side-progress {
        position: absolute;
        top: calc(84px * var(--battle-ui-scale));
        left: calc(16px * var(--battle-ui-scale));
        width: calc(160px * var(--battle-ui-scale));
        height: calc(7px * var(--battle-ui-scale));
      }
      .battle-side-progress-track {
        width: calc(160px * var(--battle-ui-scale));
        height: calc(2px * var(--battle-ui-scale));
        margin-bottom: calc(2px * var(--battle-ui-scale));
        overflow: hidden;
        background: #200;
      }
      .battle-side-progress-fill { height: 100%; width: 0; }
      .battle-side-progress-fill.troops { background: #d00000; }
      .battle-side-progress-fill.morale { background: #f0e000; }
      .battle-divider-red {
        height: calc(4px * var(--battle-ui-scale));
        border-top: 1px solid #d00;
        border-bottom: 1px solid #d00;
        background: #800;
        margin: calc(2px * var(--battle-ui-scale)) 0;
      }
      .battle-panel-inner > .battle-divider-red { display: none; }
      .battle-symbols-grid {
        position: absolute;
        top: calc(108px * var(--battle-ui-scale));
        bottom: auto;
        left: calc(32px * var(--battle-ui-scale));
        width: calc(128px * var(--battle-ui-scale));
        height: calc(32px * var(--battle-ui-scale));
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(8, calc(16px * var(--battle-ui-scale)));
        grid-template-rows: repeat(2, calc(16px * var(--battle-ui-scale)));
        gap: 0;
        background: transparent;
        padding: 0;
        border: 0;
        margin: 0;
      }
      .battle-symbol-btn {
        position: relative;
        display: block;
        width: calc(16px * var(--battle-ui-scale));
        height: calc(16px * var(--battle-ui-scale));
        background-color: #000;
        background-repeat: no-repeat;
        background-position: center;
        background-size: 16px 16px;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .battle-symbol-btn::after {
        content: "";
        position: absolute;
        inset: 1px;
        box-sizing: border-box;
        border: 1px solid transparent;
        pointer-events: none;
      }
      .battle-symbol-btn[data-formation="0"] { background-image: url("grf/ui/battle_symbol_0.png"); }
      .battle-symbol-btn[data-formation="1"] { background-image: url("grf/ui/battle_symbol_1.png"); }
      .battle-symbol-btn[data-formation="2"] { background-image: url("grf/ui/battle_symbol_2.png"); }
      .battle-symbol-btn[data-formation="3"] { background-image: url("grf/ui/battle_symbol_3.png"); }
      .battle-symbol-btn[data-formation="4"] { background-image: url("grf/ui/battle_symbol_4.png"); }
      .battle-symbol-btn[data-formation="5"] { background-image: url("grf/ui/battle_symbol_5.png"); }
      .battle-symbol-btn[data-formation="6"] { background-image: url("grf/ui/battle_symbol_6.png"); }
      .battle-symbol-btn[data-formation="7"] { background-image: url("grf/ui/battle_symbol_7.png"); }
      .battle-symbol-btn[data-formation="8"] { background-image: url("grf/ui/battle_symbol_8.png"); }
      .battle-symbol-btn[data-formation="9"] { background-image: url("grf/ui/battle_symbol_9.png"); }
      .battle-symbol-btn[data-formation="10"] { background-image: url("grf/ui/battle_symbol_10.png"); }
      .battle-symbol-btn[data-formation="11"] { background-image: url("grf/ui/battle_symbol_11.png"); }
      .battle-symbol-btn[data-formation="12"] { background-image: url("grf/ui/battle_symbol_12.png"); }
      .battle-symbol-btn[data-formation="13"] { background-image: url("grf/ui/battle_symbol_13.png"); }
      .battle-symbol-btn[data-formation="14"] { background-image: url("grf/ui/battle_symbol_14.png"); }
      .battle-symbol-btn[data-formation="15"] { background-image: url("grf/ui/battle_symbol_15.png"); }

      .battle-command-section {
        position: absolute;
        top: calc(152px * var(--battle-ui-scale));
        bottom: auto;
        left: calc(16px * var(--battle-ui-scale));
        width: calc(160px * var(--battle-ui-scale));
        height: calc(96px * var(--battle-ui-scale));
        display: flex;
        gap: calc(4px * var(--battle-ui-scale));
        margin: 0;
        align-items: stretch;
      }
      .battle-cmd-btn-column {
        display: flex;
        flex-direction: column;
        gap: 0;
        width: calc(64px * var(--battle-ui-scale));
        flex-shrink: 0;
      }
      .battle-cmd-img-btn {
        width: calc(64px * var(--battle-ui-scale));
        height: calc(16px * var(--battle-ui-scale));
        border: 1px solid #6b3214;
        background: linear-gradient(#f1d394, #c28a3a 55%, #8f5420);
        color: #111;
        font: bold calc(16px * var(--battle-ui-scale)) / calc(14px * var(--battle-ui-scale)) "Noto Serif TC", "PMingLiU", serif;
        text-shadow: 1px 0 #f6e4b3;
        cursor: pointer;
        padding: 0;
      }
      .battle-cmd-img-btn:hover:not(:disabled) {
        filter: brightness(1.25);
      }
      .battle-cmd-img-btn:disabled {
        filter: grayscale(0.8) brightness(0.5);
        cursor: not-allowed;
      }
      .battle-formation-stone {
        position: relative;
        flex: 0 0 76px;
        margin-left: auto;
        height: calc(96px * var(--battle-ui-scale));
        background: url("grf/ui/battle_formation_stone.png") no-repeat center / 76px 96px;
        border: 1px solid #d00;
      }
      .battle-deployment-btn {
        position: absolute;
        left: 6px;
        width: 64px;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }
      .battle-deployment-btn[data-base-x="48"] { top: 8px; height: 24px; }
      .battle-deployment-btn[data-base-x="28"] { top: 32px; height: 32px; }
      .battle-deployment-btn[data-base-x="5"] { top: 64px; height: 24px; }
      .battle-symbol-btn.active::after { border-color: #f0e000; }
      .battle-deployment-btn.active {
        box-shadow: inset 0 0 0 1px #f00000;
      }
      .battle-symbol-btn:focus-visible, .battle-deployment-btn:focus-visible {
        outline: 1px solid #f0e000;
      }
      /* 모바일(coarse pointer): 전투 명령 버튼 터치 목표와 팝업 글씨 확대 (표시 전용, 규칙 무영향).
         640px 레이아웃이 기기 폭에 맞춰 ~0.61배 축소 표시되므로 CSS 크기를 크게 잡는다. */
      @media (pointer: coarse) {
        .battle-player-window { height: 430px !important; }
        .battle-cmd-btn-column { width: 92px; }
        .battle-cmd-img-btn {
          width: 92px;
          height: 32px;
          font-size: 19px;
          line-height: 28px;
        }
        #battle-bottom-bar { height: 52px !important; }
        .battle-unit-card { height: 52px !important; }
        .battle-card-role-label {
          width: 48px !important;
          height: 26px !important;
          font-size: 18px !important;
          line-height: 24px !important;
        }
        .battle-dialogue {
          height: 112px !important;
          font-size: 20px !important;
          line-height: 29px !important;
        }
        /* 실제 52px 부대 바 위로 대사창을 띄우고 한글 두 줄을 보존한다. */
        .battle-dialogue[data-original-side="0"] { bottom: 72px !important; }
        .battle-dialogue-copy { height: 96px !important; }
        .battle-dialogue-text { max-height: 58px !important; }
        /* 모바일 "정보" 토글: 우측 정보 창(적 정보/작전 헤더)을 접어 전장 우측 가림 해소 */
        body.mobile-battle-info-collapsed .battle-enemy-window,
        body.mobile-battle-info-collapsed .battle-operation-header {
          display: none !important;
        }
      }

      #bcommandhint {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* 底部 6 队单位卡栏 */
      #battle-bottom-bar {
        display: none;
        position: fixed;
        bottom: calc(16px * var(--battle-ui-scale));
        left: calc(16px * var(--battle-ui-scale));
        right: auto;
        width: calc(624px * var(--battle-ui-scale));
        max-width: 100vw;
        height: calc(36px * var(--battle-ui-scale));
        background: transparent;
        border: 0;
        z-index: 31;
        user-select: none;
        box-sizing: border-box;
      }
      .battle-bottom-inner {
        height: 100%;
        display: flex;
        align-items: stretch;
        gap: 0;
        padding: 0;
      }
      .battle-unit-card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(2px * var(--battle-ui-scale));
        flex: 0 0 calc(104px * var(--battle-ui-scale));
        width: calc(104px * var(--battle-ui-scale));
        height: calc(36px * var(--battle-ui-scale));
        background: #050505;
        border: 0;
        border-top: calc(2px * var(--battle-ui-scale)) solid #d00000;
        border-bottom: calc(2px * var(--battle-ui-scale)) solid #d00000;
        border-left: calc(2px * var(--battle-ui-scale)) solid #d00000;
        cursor: pointer;
        padding: 0 calc(4px * var(--battle-ui-scale)) calc(4px * var(--battle-ui-scale));
        box-sizing: border-box;
      }
      .battle-unit-card:last-child {
        border-right: calc(2px * var(--battle-ui-scale)) solid #d00000;
      }
      .battle-unit-card:hover,
      .battle-unit-card.active {
        background: #302000;
        box-shadow: 0 0 0 1px #ffd700 inset;
      }
      .battle-unit-card.routed {
        opacity: 0.35;
        filter: grayscale(1);
        cursor: pointer;
      }
      .battle-card-role-label {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: calc(40px * var(--battle-ui-scale));
        height: calc(18px * var(--battle-ui-scale));
        box-sizing: border-box;
        border: 0;
        background: linear-gradient(#f1d394, #c28a3a 55%, #8f5420);
        color: #111;
        font: bold calc(16px * var(--battle-ui-scale)) / calc(16px * var(--battle-ui-scale)) "Noto Serif TC", "PMingLiU", serif;
        text-shadow: 1px 0 #f6e4b3;
        white-space: nowrap;
      }
      .battle-card-unit-icon {
        flex: 0 0 calc(24px * var(--battle-ui-scale));
        width: calc(24px * var(--battle-ui-scale));
        height: calc(16px * var(--battle-ui-scale));
        background-repeat: no-repeat;
        background-position: center;
        background-size: 100% 100%;
      }
      .battle-card-status {
        flex: 0 0 24px;
        width: 24px;
        height: 16px;
        background: url("grf/ui/battle_status_0.png") no-repeat center / 24px 16px;
      }
      .battle-card-troops-track {
        position: absolute;
        left: calc(2px * var(--battle-ui-scale));
        right: calc(2px * var(--battle-ui-scale));
        bottom: calc(1px * var(--battle-ui-scale));
        height: calc(3px * var(--battle-ui-scale));
        overflow: hidden;
        background: #4c2400;
      }
      .battle-card-troops-fill {
        display: block;
        width: 0;
        height: 100%;
        background: #ffd000;
      }
      .battle-dialogue {
        position: fixed;
        display: none;
        grid-template-columns: var(--battle-dialogue-portrait) 1fr;
        width: var(--battle-dialogue-width);
        height: var(--battle-dialogue-height);
        box-sizing: border-box;
        padding: var(--battle-dialogue-inset);
        /* Dialogue is presentation-only; command/card controls remain clickable. */
        pointer-events: none;
        background: #000;
        color: #fff;
        font-size: var(--popup-font-size);
        line-height: var(--battle-dialogue-line-height);
        left: 50%;
        transform: translateX(-50%);
        z-index: 33;
      }
      .battle-dialogue[data-kind]:not([data-kind=""]) { display: grid; }
      /* Object side1 is always the enemy; side0 is always the player. */
      .battle-dialogue[data-original-side="1"] { top: var(--battle-dialogue-top); bottom: auto; }
      .battle-dialogue[data-original-side="0"] { top: auto; bottom: var(--battle-dialogue-bottom); }
      .battle-dialogue img {
        width: var(--battle-dialogue-portrait);
        height: var(--battle-dialogue-portrait);
        object-fit: contain;
        image-rendering: pixelated;
      }
      .battle-dialogue > :not(.battle-window-frame) { position: relative; z-index: 1; }
      .battle-dialogue-copy {
        min-width: 0;
        height: var(--battle-dialogue-portrait);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: var(--battle-dialogue-copy-align);
        padding-left: var(--battle-dialogue-copy-gap);
        overflow: hidden;
      }
      .battle-dialogue-name {
        color: #ffd75c;
        margin-bottom: var(--battle-dialogue-name-margin);
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }
      .battle-dialogue-text {
        max-height: calc(var(--battle-dialogue-line-height) * 2);
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        /* 한글은 공백에서만 줄바꿈(끝 음절 고립 방지). 공백 없는 중국어 fallback은
           overflow-wrap:anywhere가 넘침 방지용으로만 분리한다. */
        word-break: keep-all;
      }
    </style>
    <link rel="stylesheet" href="intro/styles.css" />
  </head>
  <body>
    <canvas id="cv"></canvas>
    <!-- 确定新游戏章节/势力或存档前，只显示此背景；不装配也不绘制战略地图。 -->
    <div id="titlebg"></div>
    <!-- 旧开发用 UI 已由原版风格 GameBar (canvas 内绘制) 取代, 保留 DOM 供对话框复用 -->
    <div id="panel" class="panel" style="display: none">
      <div style="margin-bottom: 6px">
        臥龍傳 — 全劇本全國地圖（原始地形 + SINARIO.DAT 勢力數據）
      </div>
      <div id="tabs"></div>
      <div>季節 <span id="seasons"></span></div>
      <div id="clockbar" style="margin-top: 6px"></div>
      <div id="info" style="margin-top: 4px; color: #b8a67a"></div>
    </div>
    <div id="legend" class="panel" style="display: none"></div>
    <div id="cmdpanel" class="panel"></div>
    <div
      id="endv"
      style="
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        background: #000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      "
    >
      <img
        id="edimg"
        class="pixelated"
        alt=""
        style="
          max-width: 96vw;
          max-height: 88vh;
          image-rendering: pixelated;
          opacity: 0;
        "
      />
      <div
        id="edcap"
        style="
          color: #ffd700;
          margin-top: 10px;
          font-size: 15px;
          letter-spacing: 2px;
        "
      ></div>
    </div>
    <canvas
      id="startv"
      width="640"
      height="400"
      style="
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 60;
        display: none;
        cursor: pointer;
      "
    ></canvas>
    <div id="savedlg" class="panel" style="display: none">
      <div style="margin-bottom: 8px">이 기기의 저장 슬롯에 저장</div>
      <div id="saveslots"></div>
      <button id="savecancel">취소</button>
    </div>
    <div id="tip"></div>
    <canvas
      id="bcv"
      style="
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        cursor: crosshair;
      "
    ></canvas>
    <div id="bctl">
      <!-- 对话弹窗移至战场内覆盖显示 -->
      <div id="bdialogue-atk" class="battle-dialogue atk" data-kind="" data-original-side="0">
        <canvas class="battle-window-frame" data-battle-panel="dialogue" width="1" height="1" aria-hidden="true"></canvas>
        <img id="bdialogue-atk-face" alt="" />
        <div class="battle-dialogue-copy">
          <div id="bdialogue-atk-name" class="battle-dialogue-name">공격측</div>
          <div id="bdialogue-atk-text" class="battle-dialogue-text">－－－</div>
        </div>
      </div>
      <div id="bdialogue-def" class="battle-dialogue def" data-kind="" data-original-side="1">
        <canvas class="battle-window-frame" data-battle-panel="dialogue" width="1" height="1" aria-hidden="true"></canvas>
        <img id="bdialogue-def-face" alt="" />
        <div class="battle-dialogue-copy">
          <div id="bdialogue-def-name" class="battle-dialogue-name">수비측</div>
          <div id="bdialogue-def-text" class="battle-dialogue-text">－－－</div>
        </div>
      </div>

      <div class="battle-panel-inner">
        <div class="battle-operation-header battle-floating-window">
          <canvas class="battle-window-frame" data-battle-panel="title" data-window-cols="12" data-window-rows="5" width="192" height="80" aria-hidden="true"></canvas>
          <div id="btitle"></div>
          <div id="bbelligerents"></div>
        </div>

        <!-- 敌我信息分属两个独立浮窗。 -->
        <div class="battle-enemy-window battle-floating-window">
          <canvas class="battle-window-frame" data-battle-panel="enemy" data-window-cols="12" data-window-rows="7" width="192" height="112" aria-hidden="true"></canvas>
          <div class="battle-banner-row battle-banner-enemy">
            <span id="bdefname" class="battle-banner-name">수비측</span>
          </div>
          <div class="battle-stats-row def">
            <div class="battle-stat-line"><span>병력</span><span id="bdeftroops" class="battle-stat-number">0</span></div>
            <div class="battle-stat-line"><span>사기</span><span id="bdefmorale" class="battle-stat-number">0</span></div>
          </div>
          <div class="battle-side-progress enemy" aria-label="적군 병력과 사기">
            <div class="battle-side-progress-track"><div id="bdef-troops-fill" class="battle-side-progress-fill troops"></div></div>
            <div class="battle-side-progress-track"><div id="bdef-morale-fill" class="battle-side-progress-fill morale"></div></div>
          </div>
        </div>

        <div class="battle-player-window battle-floating-window">
          <canvas class="battle-window-frame" data-battle-panel="player" data-window-cols="12" data-window-rows="18" width="192" height="288" aria-hidden="true"></canvas>
          <div class="battle-banner-row battle-banner-player">
            <span id="batkname" class="battle-banner-name">공격측</span>
          </div>
          <div class="battle-stats-row atk">
            <div class="battle-stat-line"><span>병력</span><span id="batktroops" class="battle-stat-number">0</span></div>
            <div class="battle-stat-line"><span>사기</span><span id="batkmorale" class="battle-stat-number">0</span></div>
          </div>
          <div class="battle-side-progress player" aria-label="아군 병력과 사기">
            <div class="battle-side-progress-track"><div id="batk-troops-fill" class="battle-side-progress-fill troops"></div></div>
            <div class="battle-side-progress-track"><div id="batk-morale-fill" class="battle-side-progress-fill morale"></div></div>
          </div>

        <!-- C863注册整块ID3；C11A在块内细分16种阵形，不自动发命令0。 -->
        <div class="battle-symbols-grid">
          <button class="battle-symbol-btn" data-formation="0" type="button" aria-label="진형 1" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="1" type="button" aria-label="진형 2" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="2" type="button" aria-label="진형 3" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="3" type="button" aria-label="진형 4" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="4" type="button" aria-label="진형 5" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="5" type="button" aria-label="진형 6" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="6" type="button" aria-label="진형 7" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="7" type="button" aria-label="진형 8" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="8" type="button" aria-label="진형 9" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="9" type="button" aria-label="진형 10" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="10" type="button" aria-label="진형 11" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="11" type="button" aria-label="진형 12" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="12" type="button" aria-label="진형 13" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="13" type="button" aria-label="진형 14" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="14" type="button" aria-label="진형 15" aria-pressed="false"></button>
          <button class="battle-symbol-btn" data-formation="15" type="button" aria-label="진형 16" aria-pressed="false"></button>
        </div>

        <!-- 6 个战术命令按钮 + 阵形预览框 -->
        <div class="battle-command-section">
          <div class="battle-cmd-btn-column">
            <button id="bassault" class="battle-cmd-img-btn" type="button" title="돌격">돌격</button>
            <button id="battack" class="battle-cmd-img-btn" type="button" title="공격">공격</button>
            <button id="bformation" class="battle-cmd-img-btn" type="button" title="진형">진형</button>
            <button id="bwall" class="battle-cmd-img-btn" type="button" title="성벽">성벽</button>
            <button id="bdefend" class="battle-cmd-img-btn" type="button" title="수진">수진</button>
            <button id="bretreat" class="battle-cmd-img-btn" type="button" title="퇴각">퇴각</button>
          </div>
          <div class="battle-formation-stone" role="group" aria-label="배치 위치">
            <button class="battle-deployment-btn" data-base-x="48" type="button" aria-label="배치 X48" aria-pressed="false"></button>
            <button class="battle-deployment-btn" data-base-x="28" type="button" aria-label="배치 X28" aria-pressed="false"></button>
            <button class="battle-deployment-btn" data-base-x="5" type="button" aria-label="배치 X5" aria-pressed="false"></button>
          </div>
        </div>

        </div>

        <!-- 命令反馈只供辅助技术读取，不占据画面。 -->
        <div id="bcommandhint" aria-live="polite">부대를 선택한 뒤 명령을 내리십시오.</div>
      </div>
    </div>

    <!-- 底部 6 队部队卡 -->
    <div id="battle-bottom-bar">
      <div id="bunits" class="battle-bottom-inner">
        <button id="bunit0" class="battle-unit-card" data-index="0" type="button" aria-pressed="false">
          <span class="battle-card-role-label">좌익</span>
          <span class="battle-card-unit-icon" data-unit-type="infantry"></span>
          <span class="battle-card-status" aria-hidden="true"></span>
          <span class="battle-card-troops-track" aria-hidden="true"><span class="battle-card-troops-fill"></span></span>
        </button>
        <button id="bunit1" class="battle-unit-card" data-index="1" type="button" aria-pressed="false">
          <span class="battle-card-role-label">좌비</span>
          <span class="battle-card-unit-icon" data-unit-type="archer"></span>
          <span class="battle-card-status" aria-hidden="true"></span>
          <span class="battle-card-troops-track" aria-hidden="true"><span class="battle-card-troops-fill"></span></span>
        </button>
        <button id="bunit2" class="battle-unit-card" data-index="2" type="button" aria-pressed="false">
          <span class="battle-card-role-label">대장</span>
          <span class="battle-card-unit-icon" data-unit-type="cavalry"></span>
          <span class="battle-card-status" aria-hidden="true"></span>
          <span class="battle-card-troops-track" aria-hidden="true"><span class="battle-card-troops-fill"></span></span>
        </button>
        <button id="bunit3" class="battle-unit-card" data-index="3" type="button" aria-pressed="false">
          <span class="battle-card-role-label">선봉</span>
          <span class="battle-card-unit-icon" data-unit-type="cavalry"></span>
          <span class="battle-card-status" aria-hidden="true"></span>
          <span class="battle-card-troops-track" aria-hidden="true"><span class="battle-card-troops-fill"></span></span>
        </button>
        <button id="bunit4" class="battle-unit-card" data-index="4" type="button" aria-pressed="false">
          <span class="battle-card-role-label">우비</span>
          <span class="battle-card-unit-icon" data-unit-type="archer"></span>
          <span class="battle-card-status" aria-hidden="true"></span>
          <span class="battle-card-troops-track" aria-hidden="true"><span class="battle-card-troops-fill"></span></span>
        </button>
        <button id="bunit5" class="battle-unit-card" data-index="5" type="button" aria-pressed="false">
          <span class="battle-card-role-label">우익</span>
          <span class="battle-card-unit-icon" data-unit-type="infantry"></span>
          <span class="battle-card-status" aria-hidden="true"></span>
          <span class="battle-card-troops-track" aria-hidden="true"><span class="battle-card-troops-fill"></span></span>
        </button>
      </div>
    </div>
    <div id="card" class="panel"></div>
    <script type="module" src="src/boot.js"></script>
  </body>
</html>

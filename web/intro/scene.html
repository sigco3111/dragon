  <main id="wolong-intro" aria-label="와룡전 오프닝 장면">
    <section id="load-status" aria-label="오프닝 불러오기">
      <p id="load-label" role="status">오프닝 음악을 불러오는 중…</p>
      <progress id="load-progress" max="100" aria-labelledby="load-label"></progress>
      <button id="start-opening" type="button" hidden>클릭하여 시작(소리 켬)</button>
    </section>
    <div id="scene">
      <img id="landscape" class="art" src="intro/assets/landscape.png" alt="" draggable="false" />
      <div id="foreground" aria-hidden="true">
        <img id="cliff" class="art" src="intro/assets/cliff.png" alt="" draggable="false" />
        <img id="character" class="art" src="intro/assets/character-aligned-still.png" alt="" draggable="false" />
      </div>
      <img id="game-title" class="art" src="intro/assets/gametitle.png" alt="와룡전" draggable="false" />
      <p id="subtitle"></p>
      <nav id="menu-layer" aria-label="게임 조작" inert></nav>
    </div>
    <footer id="scene-footer" aria-label="저작권 안내 및 연락처" inert>
      <p id="footer-text"></p>
    </footer>
    <button id="sound-toggle" type="button" aria-label="배경 음악 켜기" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13M9 8l10-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="16" cy="16" rx="3" ry="2"/><path class="sound-slash" d="m3 3 18 18"/></svg>
      <span id="sound-hint" hidden>클릭하여 음악 재생</span>
    </button>
    <button id="replay-button" type="button" aria-label="애니메이션·음악 다시 재생" title="애니메이션·음악 다시 재생" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg>
    </button>
    <button id="skip-button" type="button" aria-label="애니메이션 건너뛰기" title="애니메이션 건너뛰기" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 10 7-10 7V5ZM19 5v14"/></svg>
    </button>
  </main>
